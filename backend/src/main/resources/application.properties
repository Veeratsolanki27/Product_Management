# Server Port (auto-assigned by cloud platforms like Render, Railway, Heroku)
server.port=${PORT:8080}

# Database Configuration
# If cloud MySQL is provided (DB_URL / MYSQL_URL / SPRING_DATASOURCE_URL), it connects to MySQL.
# Otherwise, it falls back to an embedded persistent file database (data/appdb) so the backend NEVER crashes on deployment!
spring.datasource.url=${DB_URL:${MYSQL_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/appdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:sa}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 console for easy browser database inspection if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a7c8e6b4f2d1e0a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
