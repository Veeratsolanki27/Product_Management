# Server Port (configurable via environment variable PORT for cloud deployments e.g. Render, Railway, Heroku)
server.port=${PORT:8080}

# Database Configuration (supports cloud environment variables e.g. DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (Secret & Expiration customizable via environment variables)
app.jwt.secret=${JWT_SECRET:9a7c8e6b4f2d1e0a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
