# Server Port (auto-assigned by cloud platforms like Render, Railway, Heroku)
server.port=${PORT:8080}

# Database Configuration
# Spring Boot checks standard cloud environment variables (SPRING_DATASOURCE_URL, MYSQL_URL, DB_URL, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/product_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicit Dialect prevents Hibernate from failing if database metadata is temporarily unreachable during startup
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a7c8e6b4f2d1e0a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
