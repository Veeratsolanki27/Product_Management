version: '3.8'

services:
  # MySQL 8.0 Database Container
  mysqldb:
    image: mysql:8.0
    container_name: product-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_management_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Java Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product-backend
    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysqldb:3306/product_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app-network

  # React Material UI Frontend (Served with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: product-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge

